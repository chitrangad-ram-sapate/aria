# Appendix D parameter registry (R-9): every parameter has a value, a status and a source.
# Status values: Learned | Cited | Cited (secondary) | Derived | Fetched | Synthetic | Design choice
parameters:
  quantile_levels:
    value: [0.005, 0.025, 0.165, 0.25, 0.5, 0.75, 0.835, 0.975, 0.995]
    status: Learned
    source: "M5 uncertainty levels (R11); forecasts by mlforecast + LightGBM on M5 (R10), conformal calibration (R13)"
  segment_grid:
    value: "beta = 0, 0.01 ... 0.99, 0.995 (100 segments)"
    status: Design choice
    source: PRD FR-P0-03
  margin:
    value: 0.035
    status: Cited
    source: "Kirana Club, FMCG distributor margins (R6); 3.5% base"
  margin_sensitivity:
    value: 0.05
    status: Cited
    source: "Kirana Club (R6); 5% sensitivity"
  repo_rate:
    value: 0.055
    status: Cited (secondary)
    source: "RBI MPC 7 Oct 2026, repo 5.50% (R14); holding h = unit cost x repo / 365, a lower bound"
  freight_paise_per_tkm:
    value: {"55t": 151, "road_avg": 378, "6t": 1103}
    status: Cited
    source: "NCAER for DPIIT, Logistics Cost in India 2023-24 (R1): road Rs 3.78/t-km (pp. 21, 83); 6-ton Rs 11.03 and 55-ton Rs 1.51 (pp. 21, 88)"
  salvage_share:
    value: 0.0
    status: Derived
    source: "Write-off credit E_k = unit cost x (1 - salvage share); swept 0-1 (definitional)"
  unit_cost:
    value: "price x (1 - margin)"
    status: Derived
    source: "Decision D-006; reproduces every PRD 6.1 tau* figure"
  usd_inr_fx:
    value: 94.94
    status: Fetched
    source: "Frankfurter API (ECB reference rate) api.frankfurter.app (redirects to api.frankfurter.dev/v1), rate date 2026-10-23"
    fetched: "2026-10-24"
  m5_store_population_equiv:
    value: 50000
    status: Design choice
    source: "Town demand = M5 store series x (town population / this value) x (mean store volume / store volume); keeps town volume proportional to Census 2011 population (A2, decision D-020)"
  town_population:
    value: "per network YAML (population_2011)"
    status: Cited
    source: "Census of India 2011 (R16) published city figures; citypopulation.de cross-check to be done manually (site blocks scripted access)"
  road_km:
    value: "per network YAML (routes[].road_km)"
    status: Fetched
    source: "OSRM table API on OpenStreetMap (R19), fetched once; offline fallback haversine x 1.25 labelled approximate (D-014)"
  vehicle_class_rule:
    value: "<= 100 km -> 6t, else road_avg"
    status: Design choice
    source: "Decision D-014, assumption A6"
  transit_days_rule:
    value: "max(1, ceil(road_km / 400))"
    status: Design choice
    source: "Decision D-014"
  kg_per_unit:
    value: "per category in data/mapping.yaml"
    status: Synthetic
    source: "Typical Indian pack size per food category (OFF India category median R18, not fetched); decision D-015"
  shelf_life_days:
    value: "per category range in data/mapping.yaml"
    status: Synthetic
    source: "Within USDA FoodKeeper ranges (R18); assumptions A4, A8; decision D-015"
  min_days_at_receipt_share:
    value: 0.3
    status: Synthetic
    source: "min_days_at_receipt = ceil(0.3 x shelf life) (A4, decision D-015)"
  top_products:
    value: 100
    status: Design choice
    source: "M5 FOODS_3 top 100 by volume (R10, FR-P0-01)"
  forecast_windows:
    value: 2
    status: Design choice
    source: "2 held-out 28-day windows at the end of M5 history (PRD 4.10)"
  forecast_horizon_days:
    value: 28
    status: Design choice
    source: "M5 horizon (R10)"
  e_size_columns:
    value: 300000
    status: Derived
    source: "From feasibility spike M1"
  interactive_ceiling_s:
    value: 10
    status: Cited
    source: "Nielsen response-time limits (R9)"
  bootstrap:
    value: {"resamples": 1000, "block_days": 7}
    status: Design choice
    source: "PRD 4.10, decision D-016"
  festival_dates:
    value: {"Ganesh Chaturthi": "2026-09-14", "Laxmi Pujan": "2026-11-08"}
    status: Cited
    source: "Maharashtra public holidays 2026 (R17), confirm against state order"
