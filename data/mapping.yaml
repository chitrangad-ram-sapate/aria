# Decision D-015: anonymous M5 FOODS_3 items -> food category (status: Synthetic, A8).
# Assignment is deterministic: sha256(item_id) picks a category by the weights below, and a
# second hash picks shelf_life_days inside the category's FoodKeeper range.
# min_days_at_receipt = ceil(min_days_share x shelf_life_days)  (A4).
# Town -> M5 store: round-robin over `stores` in network-YAML town order unless the town sets m5_store.
status: Synthetic
min_days_share: 0.3
stores: [CA_1, CA_2, CA_3, CA_4, TX_1, TX_2, TX_3, WI_1, WI_2, WI_3]
categories:
  dairy:
    weight: 0.20
    kg_per_unit: 0.5
    shelf_life_days: [5, 14]
    source: "Milk/curd 500 g pack; FoodKeeper refrigerated dairy 5-14 days (R18)"
  bakery:
    weight: 0.15
    kg_per_unit: 0.4
    shelf_life_days: [3, 7]
    source: "Bread 400 g loaf; FoodKeeper bread 3-7 days (R18)"
  fresh_produce:
    weight: 0.15
    kg_per_unit: 1.0
